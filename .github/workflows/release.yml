name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: "Build Installer & Draft Release"
    runs-on: windows-latest

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./oculai-desktop/package.json').version")
          echo "Tag version: $TAG_VERSION"
          echo "package.json version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            echo "::error::Bump package.json version before tagging, or fix the tag."
            exit 1
          fi

      - name: Install desktop dependencies
        run: |
          cd oculai-desktop
          npm ci

      - name: Build installer & publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd oculai-desktop
          npm run build -- --publish always

      - name: Upload installer artifact (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oculai-installer-${{ github.run_id }}
          path: |
            oculai-desktop/dist-electron/*.exe
            oculai-desktop/dist-electron/*.exe.blockmap
            oculai-desktop/dist-electron/latest.yml
          if-no-files-found: warn
          retention-days: 30
